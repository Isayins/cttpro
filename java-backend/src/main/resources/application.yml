spring:
  application:
    name: java-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/idncar?serverTimezone=GMT%2B8&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6387}
      password: ${SPRING_DATA_REDIS_PASSWORD:change-me}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  mail:
    host: ${SPRING_MAIL_HOST:smtp.163.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:pppopidc@163.com}
    password: ${SPRING_MAIL_PASSWORD:change-me}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:false}
          ssl:
            enable: ${SPRING_MAIL_SMTP_SSL_ENABLE:true}
          connectiontimeout: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${SPRING_MAIL_SMTP_TIMEOUT:10000}
          writetimeout: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT:10000}
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:1024MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:1024MB}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.idncar.model.entity

server:
  port: 9091
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

python:
  service:
    url: ${PYTHON_SERVICE_URL:http://localhost:8735}

jwt:
  secret: ${JWT_SECRET:change-me-base64-secret}
  expiration: 86400000

app:
  site:
    base-url: ${APP_SITE_BASE_URL:https://idncar.com}
  auth:
    email-code-expire-minutes: ${APP_AUTH_EMAIL_CODE_EXPIRE_MINUTES:10}
    email-code-cooldown-seconds: ${APP_AUTH_EMAIL_CODE_COOLDOWN_SECONDS:60}
  mail:
    from: ${APP_MAIL_FROM:pppopidc@163.com}
    mock-enabled: ${APP_MAIL_MOCK_ENABLED:false}
    logo-url: ${APP_MAIL_LOGO_URL:}
  upload:
    base-dir: ${APP_UPLOAD_BASE_DIR:uploads}
    avatar-subdir: ${APP_UPLOAD_AVATAR_SUBDIR:avatars}
    chat-image-subdir: ${APP_UPLOAD_CHAT_IMAGE_SUBDIR:chat-images}
    forum-image-subdir: ${APP_UPLOAD_FORUM_IMAGE_SUBDIR:forum-images}
    forum-board-avatar-subdir: ${APP_UPLOAD_FORUM_BOARD_AVATAR_SUBDIR:forum-board-avatars}
    product-image-subdir: ${APP_UPLOAD_PRODUCT_IMAGE_SUBDIR:product-images}
    download-subdir: ${APP_UPLOAD_DOWNLOAD_SUBDIR:downloads}
    download-max-size-bytes: ${APP_UPLOAD_DOWNLOAD_MAX_SIZE_BYTES:1073741824}
  hotmail:
    encryption-secret: ${APP_HOTMAIL_ENCRYPTION_SECRET:${JWT_SECRET:change-me-base64-secret}}
    code-recent-minutes: ${APP_HOTMAIL_CODE_RECENT_MINUTES:30}
    public-code-fetch-cooldown-seconds: ${APP_HOTMAIL_PUBLIC_CODE_FETCH_COOLDOWN_SECONDS:20}
    public-code-access-touch-interval-seconds: ${APP_HOTMAIL_PUBLIC_CODE_ACCESS_TOUCH_INTERVAL_SECONDS:60}
    public-code-rate-limit-per-minute: ${APP_HOTMAIL_PUBLIC_CODE_RATE_LIMIT_PER_MINUTE:60}
  schema:
    auto-init-enabled: ${APP_SCHEMA_AUTO_INIT_ENABLED:true}
  payment:
    manual-confirm:
      enabled: ${APP_PAYMENT_MANUAL_CONFIRM_ENABLED:true}
      recipients: ${APP_PAYMENT_MANUAL_CONFIRM_RECIPIENTS:}
    alipay:
      enabled: ${APP_PAYMENT_ALIPAY_ENABLED:false}
      app-id: ${APP_PAYMENT_ALIPAY_APP_ID:}
      private-key: ${APP_PAYMENT_ALIPAY_PRIVATE_KEY:}
      alipay-public-key: ${APP_PAYMENT_ALIPAY_ALIPAY_PUBLIC_KEY:}
      gateway-url: ${APP_PAYMENT_ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
      notify-url: ${APP_PAYMENT_ALIPAY_NOTIFY_URL:}
      sign-type: ${APP_PAYMENT_ALIPAY_SIGN_TYPE:RSA2}
      charset: ${APP_PAYMENT_ALIPAY_CHARSET:UTF-8}
      format: ${APP_PAYMENT_ALIPAY_FORMAT:json}
      encrypt-enabled: ${APP_PAYMENT_ALIPAY_ENCRYPT_ENABLED:true}
      encrypt-type: ${APP_PAYMENT_ALIPAY_ENCRYPT_TYPE:AES}
      encrypt-key: ${APP_PAYMENT_ALIPAY_ENCRYPT_KEY:}
      qr-code-timeout-express: ${APP_PAYMENT_ALIPAY_QR_CODE_TIMEOUT_EXPRESS:30m}
