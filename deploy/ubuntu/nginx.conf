map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $uri $auth_action_limit_key {
    default "";
    ~^/api/auth/(login|register|reset-password)$ $binary_remote_addr;
}

map $uri $auth_code_limit_key {
    default "";
    ~^/api/auth/(email-code|password-reset-code)$ $binary_remote_addr;
}

limit_req_zone $auth_action_limit_key zone=auth_action:10m rate=10r/m;
limit_req_zone $auth_code_limit_key zone=auth_code:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1024m;

    location = /healthz {
        access_log off;
        return 204;
    }

    location ^~ /api/ {
        limit_req zone=auth_action burst=5 nodelay;
        limit_req zone=auth_code burst=2 nodelay;
        limit_req_status 429;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://java-backend:9091;
    }

    location ^~ /uploads/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://java-backend:9091;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/(getState|appHeart|appPush)/?$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://java-backend:9091;
    }

    location /actuator/health {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://java-backend:9091;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
