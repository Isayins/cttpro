name: CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run check

      - name: Validate container Nginx config
        run: >-
          docker run --rm --add-host java-backend:127.0.0.1
          -v "$PWD/deploy/ubuntu/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:1.27-alpine nginx -t

      - name: Validate host Nginx config
        run: |
          mkdir -p .ci-certs/idncar.com .ci-certs/remote.idncar.com
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj '/CN=idncar.com' -keyout .ci-certs/idncar.com/privkey.pem -out .ci-certs/idncar.com/fullchain.pem >/dev/null 2>&1
          cp .ci-certs/idncar.com/privkey.pem .ci-certs/remote.idncar.com/privkey.pem
          cp .ci-certs/idncar.com/fullchain.pem .ci-certs/remote.idncar.com/fullchain.pem
          docker run --rm \
            -v "$PWD/deploy/ubuntu/nginx-host.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/.ci-certs/idncar.com:/etc/letsencrypt/live/idncar.com:ro" \
            -v "$PWD/.ci-certs/remote.idncar.com:/etc/letsencrypt/live/remote.idncar.com:ro" \
            nginx:1.27-alpine nginx -t

      - name: Validate deployment scripts
        run: |
          bash -n deploy/ubuntu/backup.sh deploy/ubuntu/verify-backup.sh deploy/ubuntu/restore.sh deploy/ubuntu/deploy-host-release.sh deploy/ubuntu/install-backend-service.sh deploy/ubuntu/test-host-release.sh deploy/ubuntu/ops-alert.sh deploy/ubuntu/ops-health-check.sh deploy/ubuntu/install-ops-timers.sh deploy/ubuntu/test-ops-scripts.sh
          bash deploy/ubuntu/test-host-release.sh
          bash deploy/ubuntu/test-ops-scripts.sh

      - name: Upload frontend build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error

  java-backend:
    name: Java backend check and package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: java-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Test and package backend
        run: ./mvnw -B -ntp package

      - name: Upload backend package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: java-backend-jar
          path: java-backend/target/java-backend-*.jar
          if-no-files-found: error

  deploy:
    name: Deploy host release
    runs-on: ubuntu-latest
    needs:
      - frontend
      - java-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release-bundle/dist

      - name: Download backend package
        uses: actions/download-artifact@v4
        with:
          name: java-backend-jar
          path: backend-package

      - name: Assemble release bundle
        run: |
          cp backend-package/java-backend-*.jar release-bundle/java-backend.jar
          cp deploy/ubuntu/deploy-host-release.sh release-bundle/deploy-host-release.sh
          mkdir -p release-bundle/ops
          cp deploy/ubuntu/*.sh release-bundle/ops/

      - name: Upload release bundle
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: 22
          source: "release-bundle/*"
          target: "/opt/cttpro/incoming/${{ github.sha }}/"
          strip_components: 1

      - name: Activate release
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            chmod +x /opt/cttpro/incoming/${{ github.sha }}/deploy-host-release.sh
            bash /opt/cttpro/incoming/${{ github.sha }}/deploy-host-release.sh ${{ github.sha }}
